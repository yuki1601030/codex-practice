<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家族旅行メモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 画面上部に表示するアプリのタイトルです -->
    <h1>家族旅行メモ</h1>

    <!-- 旅行先とメモを入力するフォームです -->
    <section class="form-card" aria-labelledby="form-title">
      <h2 id="form-title">旅行の予定を追加</h2>

      <label for="destination">旅行先の名前</label>
      <input id="destination" type="text" placeholder="例：沖縄" autocomplete="off">

      <label for="memo">メモ</label>
      <textarea id="memo" rows="4" placeholder="例：海で遊ぶ、写真をたくさん撮る"></textarea>

      <!-- 想定費用は数字だけ入力できます。空欄のまま追加すると0円として保存します -->
      <label for="estimatedCost">想定費用（円）</label>
      <input id="estimatedCost" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="例：3000" autocomplete="off">

      <!-- 旅行の日程を選ぶ欄です。決まっていない場合は「未定」を選べます -->
      <label for="day">日程</label>
      <select id="day">
        <option value="1日目">1日目</option>
        <option value="2日目">2日目</option>
        <option value="3日目">3日目</option>
        <option value="未定" selected>未定</option>
      </select>

      <!-- 旅行中の時間帯を選ぶ欄です。まだ決まっていない場合は「未定」を選べます -->
      <label for="timeOfDay">時間帯</label>
      <select id="timeOfDay">
        <option value="朝">朝</option>
        <option value="昼">昼</option>
        <option value="午後">午後</option>
        <option value="夜">夜</option>
        <option value="未定" selected>未定</option>
      </select>

      <!-- 旅行メモの大切さを選ぶ欄です -->
      <label for="priority">優先度</label>
      <select id="priority">
        <option value="高">高</option>
        <option value="中" selected>中</option>
        <option value="低">低</option>
      </select>

      <!-- 旅行の状態を選ぶ欄です。初期値は「行きたい」です -->
      <label for="status">ステータス</label>
      <select id="status">
        <option value="行きたい" selected>行きたい</option>
        <option value="行った">行った</option>
      </select>

      <button id="addButton" type="button">追加</button>
    </section>

    <!-- 追加した内容がここに一覧表示されます -->
    <section class="list-card" aria-labelledby="list-title">
      <h2 id="list-title">日程別プラン</h2>

      <!-- 登録済みの旅行メモすべてから、全体と日程別の予算合計を表示します -->
      <section class="budget-summary" aria-label="予算の合計">
        <p class="total-budget" id="totalBudget">合計予算：0円</p>
        <div class="day-budget-list" id="dayBudgetList"></div>
      </section>

      <!-- 入力した文字で、旅行先名またはメモ内容に合う旅行メモだけを表示します -->
      <label for="searchInput" class="search-label">検索</label>
      <input id="searchInput" class="search-input" type="search" placeholder="旅行先名・メモ内容で検索" autocomplete="off">

      <ul id="memoList" class="memo-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
